<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIỆM NHÀ TẠO POS - Matcha & Coffee</title>
    <!-- Nhập TailwindCSS CDN để đảm bảo giao diện 100% không bị lỗi thô -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              matcha: {
                50: '#f2f7f2',
                100: '#e1ede1',
                500: '#52796f',
                600: '#354f52',
                700: '#2f3e46',
                800: '#1f2d2a',
                900: '#111d1a',
              },
              coffee: {
                50: '#fdf8f5',
                100: '#f5ebe0',
                500: '#a3b18a',
                600: '#a0522d',
                700: '#6f371d',
                800: '#4a2411',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      @media print {
        body * { visibility: hidden; }
        #print-area, #print-area * { visibility: visible; }
        #print-area { position: absolute; left: 0; top: 0; width: 80mm; }
      }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-800 antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
